<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>简历仓库 · 本地简历打包与定制</title>
    <meta name="color-scheme" content="light dark" />
    <!-- 离线优先：不加载任何外部字体 / CDN / 图标库（AC-UI-01） -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/styles/tokens.css" />
    <link rel="stylesheet" href="./src/styles/base.css" />
    <link rel="stylesheet" href="./src/styles/layout.css" />
    <link rel="stylesheet" href="./src/styles/components.css" />
    <link rel="stylesheet" href="./src/styles/print.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">跳到主内容</a>

    <div class="app">
      <!-- 顶层状态条：本地地址（同源，端口由启动脚本决定）/ 模型 / 字体 / 最近导出 -->
      <div id="statusbar"></div>

      <div class="app__body">
        <nav id="sidenav" aria-label="主导航"></nav>

        <div class="main">
          <div id="topbar"></div>
          <main class="main__scroll" id="view" tabindex="-1">
            <div class="page">
              <div class="ui-skel ui-skel--title"></div>
              <div class="ui-skel ui-skel--line"></div>
            </div>
          </main>
        </div>
      </div>
    </div>

    <div id="layer-root"></div>
    <div id="toast-root"></div>

    <noscript>
      <div class="page">
        <div class="ui-callout ui-callout--warn">
          <strong>需要启用 JavaScript。</strong>
          <div>这个应用完全在本机运行，但界面需要 JS 才能渲染。请允许本地页面运行脚本。</div>
        </div>
      </div>
    </noscript>

    <script type="module" src="./src/boot.js"></script>
  </body>
</html>
