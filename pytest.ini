[pytest]
testpaths = tests
# 只收集 tests/ 下的用例，避免在仓库根意外扫到 data/ 里的临时目录。
norecursedirs = data .venv node_modules scripts __pycache__
# 未知 marker 直接报错，而不是静默忽略（否则「我标了 noservice 但没生效」没人发现）。
addopts = --strict-markers
markers =
    noservice: 不启动任何服务/浏览器的纯逻辑用例（毫秒级，单文件必须 <5 秒）
    needs_app: 需要 Flask 应用与临时 DATA_DIR（函数级，惰性创建）
    browser: 需要真 Chrome + CDP（最慢，环境缺失时 skip）

# 说明：本文件的重点是「单文件快」。任何用例只要不请求 app_env/client 夹具，
# 就不会创建临时 DATA_DIR、不会迁移库、不会起服务——由 tests/conftest.py 的
# pytest_collection_modifyitems 自动打上 noservice 标记，`pytest -m noservice` 即可只跑这层。
